name: Android debug APK

# Builds the Phase 1 Capacitor shell and publishes the debug APK as a workflow artifact so it can be
# downloaded straight onto a phone. This workflow is intentionally limited to the debug shell: no
# signing material, no release variant, and no Phase 2+ functionality.
#
# The upstream backend is NOT hardcoded anywhere. It is read from the repository variable
# KAIREMA_API_BASE_URL (Settings -> Secrets and variables -> Actions -> Variables). That variable is
# not treated as a secret: it is a public service URL. It must be set or this workflow stops before
# building, because a shell without an upstream would ship with no API at all.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-capacitor-shell

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  ANDROID_COMPILE_SDK: "36"

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the *repository variable* through the `vars` context on purpose. This must never
      # become `secrets.KAIREMA_API_BASE_URL`: the upstream is a public service URL, not a
      # credential, and a repository variable is the correct scope for it.
      #
      # `${FROM_REPO:-}` matters: `set -u` would otherwise abort with an "unbound variable"
      # failure whenever the vars context resolves to nothing, which hides the real diagnosis.
      # VISIBLE_VAR_NAMES lists variable NAMES only (never values) so a failed run immediately
      # shows whether this repository exposes any Actions variables at all.
      - name: Resolve KAIREMA_API_BASE_URL
        id: api_base_url
        env:
          FROM_REPO: ${{ vars.KAIREMA_API_BASE_URL }}
          VISIBLE_VAR_NAMES: ${{ join(vars.*, ', ') }}
        run: |
          set -euo pipefail
          value="${FROM_REPO:-}"
          value="$(printf '%s' "$value" | tr -d '[:space:]')"
          if [ -z "$value" ]; then
            echo "::error::Repository variable KAIREMA_API_BASE_URL resolved to an empty value."
            echo "::error::repository=${{ github.repository }}"
            echo "::error::ref=${{ github.ref }}"
            echo "::error::actions variables visible to this run: '${VISIBLE_VAR_NAMES:-<none>}'"
            echo "::error::If that list is empty, the variable is not defined on this repository,"
            echo "::error::or it is scoped to an Environment, which a job must declare to see."
            echo "::error::If the list is not empty, the variable name must match exactly."
            exit 1
          fi
          case "$value" in
            https://*) ;;
            *)
              echo "::error::KAIREMA_API_BASE_URL must start with https://"
              exit 1
              ;;
          esac
          echo "Resolved an https:// upstream from the repository variable."
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # No `with: version` here on purpose. package.json already pins the package manager via
      # "packageManager": "pnpm@10.4.1+...", and pnpm/action-setup reads it. Passing `version` as
      # well makes the action reject the run with "Multiple versions of pnpm specified".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The action's default `packages` input is "tools platform-tools". The obsolete `tools`
      # package no longer exists in the current sdkmanager repository, so leaving the default in
      # place fails this step with `Failed to find package 'tools'`. Overriding `packages`
      # replaces the default entirely; cmdline-tools, which provides sdkmanager itself, is
      # installed by the action regardless of this value.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;36.0.0"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # KAIREMA_ANDROID_DEBUG=1 turns on WebView contents debugging so the shell can be inspected from
      # the phone via chrome://inspect. KAIREMA_API_BASE_URL must be in the environment here, because
      # `cap sync` is what writes apiBaseUrl into assets/capacitor.config.json.
      - name: Build the debug APK
        env:
          KAIREMA_API_BASE_URL: ${{ steps.api_base_url.outputs.value }}
          KAIREMA_ANDROID_DEBUG: "1"
        run: pnpm android:build

      - name: Verify generated Capacitor config
        env:
          KAIREMA_API_BASE_URL: ${{ steps.api_base_url.outputs.value }}
        run: |
          set -euo pipefail
          config="android/app/src/main/assets/capacitor.config.json"
          test -f "$config" || { echo "::error::missing $config"; exit 1; }

          value="$(node -e "const c=require('./'+process.argv[1]);const p=(c.plugins&&c.plugins.KairemaLoopback)||{};process.stdout.write(String(p.apiBaseUrl||''));" "$config")"
          if [ -z "$value" ]; then
            echo "::error::apiBaseUrl is empty in $config; the shell would have no API."
            exit 1
          fi
          if [ "$value" != "$KAIREMA_API_BASE_URL" ]; then
            echo "::error::apiBaseUrl in $config does not match the configured upstream."
            exit 1
          fi
          if node -e "const c=require('./'+process.argv[1]);process.exit(c.server&&c.server.url?0:1);" "$config"; then
            echo "::error::$config sets server.url; the shell must bundle the web app locally."
            exit 1
          fi
          echo "Capacitor config verified: non-empty apiBaseUrl, no server.url."

      - name: Verify APK exists
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "::error::missing $apk"; exit 1; }
          echo "Found $apk ($(stat -c%s "$apk") bytes)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kairema-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30